<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F4F9FF">
  <meta name="description" content="D Point — แตะ · สะสม · เลเวลอัป สะสมแสตมป์ทุกร้านในบัตรเดียว">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>D Point</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>
  <!-- Animated intro: plays while the app boots (the iOS launch screen is the same plain background) -->
  <div id="splash" class="intro" role="status" aria-label="กำลังเปิด D Point">
    <div class="intro-glow"></div>
    <div class="intro-stage">
      <span class="intro-spark s1"></span><span class="intro-spark s2"></span><span class="intro-spark s3"></span><span class="intro-spark s4"></span><span class="intro-spark s5"></span>
      <span class="intro-shadow"></span>
      <img class="intro-mascot" src="/img/pointie-cheer.png" alt="">
    </div>
    <img class="intro-logo" src="/img/logo-dpoint.png" alt="D Point">
    <p class="intro-tag">แตะ · สะสม · เลเวลอัป</p>
    <div class="intro-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/js/vendor/supabase.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
